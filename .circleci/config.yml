version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2023.11.1
    steps:
      - checkout

      - run:
          name: Prepare Environment
          command: ./prepare.sh

      - run:
          name: Build APK
          command: ./gradlew assembleRelease

  deploy:
    docker:
      - image: cimg/android:2023.11.1
    steps:
      - checkout

      - run:
          name: Deploy Release
          command: ./deploy.sh

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
